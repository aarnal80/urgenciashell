<!DOCTYPE html>
<html lang="es">
<head>

  <title>Manual de Urgencias in HELL</title>

      </section>
    </main>

  <div id="modal-root"></div>

  <script src="topics-data.js"></script>
  <script src="scales-data.js"></script>
  <script src="scales-extra.js"></script>
  <script src="drugs-index.js"></script>

  <script src="ddx-demo.js"></script>
  <script src="app.js"></script>
