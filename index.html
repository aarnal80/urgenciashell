<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>Manual de Urgencias · Hospital Ernest Lluch</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell">

    <!-- Barra superior compacta (vistas de detalle) -->
    <header id="topbar" hidden>
      <button id="back-btn" class="tb-btn" aria-label="Volver"></button>
      <div class="tb-brand">
        <span>Manual de Urgencias · HELL</span>
      </div>
      <div class="tb-actions">
        <button id="tb-fav" class="tb-btn" aria-label="Guardar en favoritos" hidden></button>
        <button id="tb-search" class="tb-btn" aria-label="Buscar"></button>
        <button id="tb-size" class="tb-btn" aria-label="Tamaño de letra"></button>
        <button id="tb-theme" class="tb-btn" aria-label="Cambiar tema"></button>
      </div>
    </header>

    <main id="view">
      <!-- INICIO -->
      <section id="home" class="screen">
        <div class="hero">
          <div class="hero-top">
            <span class="hero-eyebrow">Hospital Ernest Lluch · HELL</span>
            <div class="hero-actions">
              <button id="hero-size" class="hero-round" aria-label="Tamaño de letra"></button>
              <button id="hero-theme" class="hero-round" aria-label="Cambiar tema"></button>
            </div>
          </div>
          <h1 class="hero-title">Manual de Urgencias</h1>
          <div class="ystripe"></div>
          <div class="hero-sub">Guía de consulta rápida · 1.ª edición 2026</div>
          <div class="hero-author">Dr. Antonio J. Arnal Meinhardt — Medicina de Urgencias</div>
          <button id="hero-search" class="hero-search" type="button">
            <span class="hs-ic"></span>
            <span class="hs-ph">Buscar tema, fármaco o escala…</span>
            <span class="hs-kbd">⌘K</span>
          </button>
        </div>

        <div class="home-body">
          <div id="home-continue"></div>
          <div class="sec-label">Herramientas</div>
          <div id="home-tools" class="tools"></div>
          <div class="sec-head">
            <span class="sec-label">Partes del manual</span>
            <span class="sec-count" id="parts-count"></span>
          </div>
          <div id="home-parts" class="parts"></div>
        </div>
      </section>

      <!-- DETALLE (tema / fármaco / calculadoras / acerca de) -->
      <article id="topic" class="screen" hidden></article>
    </main>

    <!-- Tab bar inferior -->
    <nav id="tabbar" aria-label="Secciones"></nav>
  </div>

  <!-- Buscador a pantalla completa -->
  <div id="search-panel" hidden>
    <div class="sp-bar">
      <span class="sp-ic"></span>
      <input id="search" type="search" placeholder="Buscar tema, fármaco, síntoma…" autocomplete="off" />
      <button id="search-cancel" type="button">Cancelar</button>
    </div>
    <div id="count" class="sp-count"></div>
    <nav id="topic-list" aria-label="Resultados"></nav>
  </div>

  <div id="modal-root"></div>

  <script src="topics-data.js"></script>
  <script src="scales-data.js"></script>
  <script src="scales-extra.js"></script>
  <script src="drugs-index.js"></script>
  <script src="drug-aliases.js"></script>
  <script src="topics-extra.js"></script>
  <script src="ddx-demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
